<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo & PDF Compress</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>Photo Compressor (Target KB)</h2>
        <p>আপনার ছবি আপলোড করুন এবং কত KB চান তা লিখে কমপ্রেস করুন।</p>
        
        <input type="file" id="upload" accept="image/*"><br><br>
        
        <label for="targetKB">Target Size (KB): </label>
        <input type="number" id="targetKB" placeholder="যেমন: 50" min="1"><br><br>
        
        <button id="compressBtn">Compress Image</button>
        
        <div id="result" style="display:none;">
            <h3>ফলাফল:</h3>
            <p id="sizeInfo"></p>
            <a id="downloadBtn" download="compressed-image.jpg">Download Image</a>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
